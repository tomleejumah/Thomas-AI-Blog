services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ace
      POSTGRES_PASSWORD: ace
      POSTGRES_DB: ace
    ports:
      - "5432:5432"
    volumes:
      - ace_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ace_redis:/data

volumes:
  ace_pg:
  ace_redis:
